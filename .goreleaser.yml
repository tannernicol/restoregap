# Release build for the restoregap CLI.
#
# WHY THIS FILE EXISTS (added 2026-08-12):
# The launch checklist recorded release tooling as done. It was not — there was
# no goreleaser config, no workflow, and no tags, while internal/cli/root.go
# declared "Version is stamped at build time via -ldflags" with nothing doing
# the stamping. Cutting a tag would have produced no binaries and a CLI still
# reporting 0.0.0-dev, discovered during launch week. The README promises
# "or grab a release binary", so something has to actually build one.
#
# TOOLCHAIN PIN: this machine runs Go 1.25 with GOTOOLCHAIN=local, and
# goreleaser v2.17+ requires Go >= 1.26.5. v2.5.1 is the pin that installs and
# runs here; the workflow pins the same line. Raise both together, never one.
version: 2
project_name: restoregap

before:
  hooks:
    - go mod tidy

builds:
  - id: restoregap
    main: ./cmd/restoregap
    binary: restoregap
    env:
      - CGO_ENABLED=0
    # Self-hosters run Linux boxes and drive them from a Mac. Windows is
    # omitted until someone asks; an untested target in the release table is a
    # support burden, not a feature.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # This is the whole point of the file: without -X the binary ships as
      # 0.0.0-dev no matter what tag built it.
      - -s -w -X github.com/tannernicol/restoregap/internal/cli.Version={{.Version}}
    # Reproducible builds: with -trimpath (no absolute paths), -s -w (no
    # symbol table/buildinfo variance) and a pinned modtimestamp, two builds of
    # the same commit produce byte-identical archives — the checksums and the
    # SBOMs below then mean something stable, and anyone can rebuild a release
    # binary and check it against checksums.txt themselves.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# SBOM per archive, in the two formats consumers actually feed tools: SPDX-json
# (license/REUSE-side tooling) and CycloneDX (dependency/supply-chain scanners).
# goreleaser shells out to `syft` — it must already be on PATH on the release
# runner; goreleaser never installs it (PLATFORM.md §3: no tool is fetched at
# gate time). If syft is absent the release FAILS rather than silently shipping
# archives with no SBOM.
sboms:
  - id: archive-spdx
    artifacts: archive
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]
    documents: ["${artifact}.spdx.json"]
  - id: archive-cyclonedx
    artifacts: archive
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
    documents: ["${artifact}.cdx.json"]

checksum:
  name_template: checksums.txt

# Signing is COMMENTED OUT ON PURPOSE, not forgotten: keyless cosign needs the
# OIDC identity of the release actor (the workflow token at tag time). This
# repo releases from a self-hosted runner whose identity nobody has agreed to
# trust yet — enabling this now would either hard-fail the release or sign
# with an identity that gives false assurance. UNCOMMENT AT PUBLIC LAUNCH, in
# the same commit that flips the repo public and pins the runner identity.
# Requires cosign on PATH (same no-fetch rule as syft above).
#
# signs:
#   - cmd: cosign
#     # Sign checksums.txt, not each archive: one signature then covers every
#     # artifact named in it, SBOMs included.
#     artifacts: checksum
#     output: true
#     signature: "${artifact}.sig"
#     certificate: "${artifact}.pem"
#     args:
#       - sign-blob
#       - --yes
#       - --output-signature
#       - "${signature}"
#       - --output-certificate
#       - "${certificate}"
#       - "${artifact}"

snapshot:
  # Local proof builds are labelled so a snapshot can never be mistaken for a
  # real release binary.
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # The repo is private until Tanner flips it. Draft keeps the first tag from
  # announcing itself the moment it lands.
  draft: true
  prerelease: auto
