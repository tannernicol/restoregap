# ci/verify.yml — the SINGLE SOURCE OF TRUTH for the server-side gauntlet
# workflow (ENFORCEMENT §6). Every conforming service carries a byte-identical
# copy at .gitea/workflows/verify.yml; `platform-conform` diffs it against this
# file, so a drifted — or deleted — workflow is a conformance failure. Same
# reference-not-copy treatment mk/verify.mk and .golangci.yml already get.
#
# Three properties this file exists to guarantee:
#
#  1. HERMETIC. The platform SDK is cloned from COMMITTED git objects at the SHA
#     pinned in .platform-sdk-ref — never symlinked to $HOME/homelab, whose
#     working tree may carry uncommitted edits. A green run is reproducible from
#     git alone. The pinned SHA is additionally asserted to be reachable from a
#     Gitea remote branch, so CI can never go green on an SDK commit that exists
#     only on this box.
#  2. TIER-AWARE. The target comes from .platform-gate (tier 2 -> verify-tier2-push:
#     verify + gosec, mutation NOT included), so the server-side gate is never
#     weaker than the bypassable pre-push hook, which runs the identical target
#     (mk/verify.mk's `verify-tier2-push`).
#  3. BOUNDED. timeout-minutes stops a hung gauntlet from pinning the single
#     runner forever; the concurrency group drops superseded runs.
#
# TWO-LANE CI (owner decision, 2026-09-17): this job — "gauntlet", the required
# status check branch protection references — is the FAST lane: it must never
# run gremlins mutation testing, whose full sweep took ~110 min on money (94%
# of that run) and blocked every OTHER repo's CI behind a single 30-minute
# timeout on one host runner. Tier-2 mutation moved to the separate HEAVY lane,
# ci/mutation.yml (`runs-on: heavy`, its own concurrency group, diff-scoped on
# pull requests plus a full weekly sweep) — never required, never blocking this
# job. A tier-2 repo therefore carries BOTH .gitea/workflows/verify.yml (this
# file) and .gitea/workflows/mutation.yml; `platform-conform` requires both.
name: verify

# `push` fires only for the default branch: a feature-branch commit under an
# open PR must produce exactly one server-side run (the `pull_request` one,
# which is the required context branch protection reads), never a second
# `push` run racing it in the same concurrency group. `main`/`master` covers
# both default-branch names in the fleet, so main still gets a post-merge
# verdict. A feature branch with no open PR gets no server-side run at all —
# the pre-push hook runs the identical gauntlet locally, and nothing merges
# without the PR check anyway.
on:
  push:
    branches: [main, master]
  pull_request:

# One in-flight run per (event, source-repository, source-branch): dedupes
# rapid re-pushes to the same PR or branch, same as before. github.event_name
# is now part of the key so a `push` run and a `pull_request` run can never
# land in the same group and cancel each other — the root cause of the
# required context going permanently red on a race (verify/gauntlet
# cancellations on platform/bin #2, platform/infra-config #7,
# homelab/llm-monitor #2, 2026-09-17).
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gauntlet:
    runs-on: host
    # FAST lane (see the header): mutation testing does NOT run here, so the
    # slowest case is a cold golangci-lint/govulncheck cache, not a gremlins
    # sweep. 30 is slack above that real cost, low enough that a hang still
    # frees the single host runner promptly.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: pin platform SDK (hermetic — committed objects only)
        run: |
          set -euo pipefail
          test -f .platform-sdk-ref || {
            echo "::error::missing .platform-sdk-ref (one line: the homelab commit this service builds against)"
            exit 1
          }
          ref=$(tr -d '[:space:]' < .platform-sdk-ref)
          src="$HOME/homelab"
          test -d "$src/.git" || { echo "::error::platform SDK source not found at $src"; exit 1; }

          # The pinned commit must be PUBLISHED, not just local: otherwise a
          # green run could depend on an SDK commit nobody else can fetch.
          if ! git -C "$src" branch -r --contains "$ref" 2>/dev/null | grep -q .; then
            echo "::error::.platform-sdk-ref $ref is not reachable from any remote branch — push homelab first"
            exit 1
          fi

          # Clone (not symlink) so only COMMITTED objects cross the boundary.
          rm -rf ../platform-sdk
          git clone --quiet --no-checkout "$src" ../platform-sdk
          # Preserve the source remote-tracking publication refs in the isolated clone.
          # A local clone copies local heads, not refs/remotes/*; without this,
          # platform-conform sees the fetched object as unpublished.
          git -C ../platform-sdk fetch --quiet "$src" '+refs/remotes/*:refs/remotes/published/*'
          git -C ../platform-sdk fetch --quiet "$src" "$ref"
          git -C ../platform-sdk checkout --quiet --detach "$ref"
          echo "platform SDK pinned at $ref"
          git -C ../platform-sdk --no-pager log -1 --format='  %h %s'

          # The clone must itself be clean — a dirty SDK checkout would mean the
          # gauntlet is again running against something git does not describe.
          test -z "$(git -C ../platform-sdk status --porcelain)" || {
            echo "::error::pinned SDK checkout is not clean"; exit 1; }

          # SDK consumers declare `replace <private-git-host>/tanner/homelab =>
          # ../homelab` so local dev resolves the private module on-box. In CI
          # that path does not exist and the gauntlet dies at `go vet` with
          # "replacement directory ../homelab does not exist" — which is exactly
          # how money, notes, email and platform-dashboard sat RED for days
          # while their pre-push hook stayed green, because $HOME/homelab does
          # exist there. Point the path at the PINNED clone so the replace
          # resolves to committed objects and hermeticity is preserved.
          #
          # Never delete a real directory here: outside a runner workspace ".."
          # is $HOME, and an unguarded rm would take out the SDK checkout
          # itself. Only create the link when nothing real occupies the path.
          if [ -L ../homelab ] || [ ! -e ../homelab ]; then
            ln -sfn platform-sdk ../homelab
            echo "  ../homelab -> platform-sdk (satisfies the go.mod replace)"
          fi

      - name: prepare UI kit (committed source + browser)
        run: |
          set -euo pipefail
          echo "PLATFORM_SDK_ROOT=$PWD/../platform-sdk" >> "$GITHUB_ENV"
          if [ -f .ui-kit.json ] || [ -f .ui-kit-source ]; then
            "$PWD/../platform-sdk/scripts/ui-kit-prepare.sh" --repo "$PWD"
          else
            echo "no UI kit enrollment; retaining legacy UI lane"
          fi

      - name: select gauntlet tier
        run: |
          set -euo pipefail
          test -f .platform-gate || {
            echo "::error::missing .platform-gate (one line: the tier, 0, 1 or 2)"
            exit 1
          }
          tier=$(head -1 .platform-gate | tr -d '[:space:]')
          case "$tier" in
            0) target=verify ;;
            1) target=verify ;;
            # verify-tier2-push, NOT verify-tier2: this FAST lane never runs
            # gremlins mutation testing (see the header) — that is
            # ci/mutation.yml's job, on its own runner and schedule. The
            # pre-push hook runs the identical verify-tier2-push target, so
            # this stays no weaker than the bypassable local gate.
            2) target=verify-tier2-push ;;
            *) echo "::error::.platform-gate tier must be 0, 1 or 2, got '$tier'"; exit 1 ;;
          esac
          echo "PLATFORM_TIER=$tier" >> "$GITHUB_ENV"
          echo "PLATFORM_TARGET=$target" >> "$GITHUB_ENV"
          echo "tier $tier -> make $target"

      - name: conformance
        run: $HOME/bin/platform-conform --homelab-root "$PWD/../platform-sdk" .

      - name: platform gauntlet
        # PLATFORM_MK is passed explicitly: a service Makefile defaults it to
        # $(HOME)/homelab/mk/verify.mk, which would read the LIVE SDK tree and
        # silently undo the pin above. Overriding it points the gauntlet — and,
        # via PLATFORM_MK_DIR, the shared .golangci.yml and check-coverage.sh —
        # at the pinned clone. Command-line assignment beats the Makefile's `?=`.
        run: |
          set -euo pipefail
          echo "== make $PLATFORM_TARGET (tier $PLATFORM_TIER) =="
          make PLATFORM_MK="$PWD/../platform-sdk/mk/verify.mk" "$PLATFORM_TARGET"

      - name: gauntlet report
        # Always: a RED report is the one worth keeping. PLATFORM §4 says Tanner
        # reads the gauntlet report — this is where it lands (the dashboard and
        # the telemetry sweep both read this directory).
        if: always()
        run: $HOME/bin/gauntlet-report
          --repo "${{ github.repository }}"
          --sha "${{ github.sha }}"
          --ref "${{ github.ref }}"
          --tier "$PLATFORM_TIER"
          --status "${{ job.status }}"
          --coverage-profile coverage.out
          --steps .gauntlet-steps.log
          --sdk-root "$PWD/../platform-sdk"

      - name: publish release artifact
        # Releases: ship (ENFORCEMENT.md, OWNER DECISION 2026-09-17). CI builds
        # the versioned, checksummed artifact for the exact green SHA; it never
        # touches a live service — that is `ship <app>`'s job, run separately by
        # a human or agent. No `if: always()` here: this step must only run once
        # every earlier step in THIS job already succeeded (the default
        # behavior), on top of the push/branch/opt-in checks below, so a red
        # gauntlet can never produce a "green" artifact.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "publish release artifact: not a push event, skipping"
            exit 0
          fi
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "publish release artifact: ${{ github.ref_name }} is not the default branch (${{ github.event.repository.default_branch }}), skipping"
            exit 0
          fi
          if [ ! -f .ship.json ]; then
            echo "publish release artifact: no .ship.json in this repo, skipping"
            exit 0
          fi
          if [ ! -d "$PLATFORM_SDK_ROOT/cmd/ship" ]; then
            echo "publish release artifact: pinned platform SDK ($(cat .platform-sdk-ref)) predates cmd/ship, skipping"
            exit 0
          fi
          go run -C "$PLATFORM_SDK_ROOT" ./cmd/ship pack \
            -dir "$PWD" \
            -repo "${{ github.repository }}" \
            -sha "${{ github.sha }}" \
            -ref "${{ github.ref }}"
