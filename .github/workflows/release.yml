# Cut a release when a v* tag is pushed.
#
# Deliberately does NOT run `make verify`: that target includes the platform
# gate from a checkout that only exists on Tanner's machine, so it cannot run
# here. The checks below are the portable subset.
#
# The scrub gate runs BEFORE anything is published. This repo leaked a real
# ed25519 private key once (2026-08-03) past a scan that only looked for
# identity, so "we already checked locally" is not the standard — a release is
# the moment the contents become permanent and public.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from history; a shallow clone
          # silently produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # The identity denylist is gitignored on purpose (the list of names is
      # itself the leak), so CI gets it from a repository secret. Each term is
      # masked before the scan so a hit can never print the term into a
      # public Actions log. Missing secret = missing denylist = the gate fails
      # closed, exactly as it does locally.
      - name: scrub gate
        env:
          SCRUB_DENYLIST_CONTENT: ${{ secrets.SCRUB_DENYLIST }}
        run: |
          if [ -n "$SCRUB_DENYLIST_CONTENT" ]; then
            printf '%s\n' "$SCRUB_DENYLIST_CONTENT" | while IFS= read -r t; do
              [ -n "$t" ] && echo "::add-mask::$t"
            done
            printf '%s\n' "$SCRUB_DENYLIST_CONTENT" > .scrub-denylist
          fi
          bash scripts/scrub-check.sh
          rm -f .scrub-denylist

      # The README's install line pins a tag so a reader runs the script they
      # read. A release whose tag differs from that pin ships a README telling
      # people to install the PREVIOUS version — caught live on 2026-08-18
      # (v0.9.2 released, README still said v0.9.1). Fail here, not in a
      # stranger's terminal.
      - name: readme install pin matches this tag
        run: |
          pin=$(grep -oE 'restoregap/v[0-9]+\.[0-9]+\.[0-9]+/scripts/install\.sh' README.md | head -1 | cut -d/ -f2)
          [ "$pin" = "$GITHUB_REF_NAME" ] || { echo "README installer pin is $pin but releasing $GITHUB_REF_NAME — update README.md"; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: release
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned to the line that runs on the repo's Go version. goreleaser
          # v2.17+ requires Go >= 1.26.5; raise this and go.mod together.
          version: "~> v2.5"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
